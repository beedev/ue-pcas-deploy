# UE PCAS demo. Generated by scripts/publish-deploy.sh from ue-pcas 795c9ab; do not edit here. Pulls the images from ghcr.io.
# UE PCAS local stack. Host ports: kong 8080 and 8000 (the single-origin edge, D-150; web and pcas-api are no longer published), mock-systems 8090, keycloak 8180, postgres 5433. Every port is bound to 127.0.0.1 only (D-134).
name: ue-pcas-demo

services:
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcas}
      POSTGRES_DB: ${POSTGRES_DB:-pcas}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcas} -d ${POSTGRES_DB:-pcas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.2
    # KEYCLOAK_PATH is the path part of KEYCLOAK_URL when the sign-in service is published under one (for example /ue-pcas-keycloak); empty serves it at the root.
    command: start-dev --import-realm --http-port=8180 --http-relative-path=${KEYCLOAK_PATH:-/}
    environment:
      # Keeps the health endpoints on port 9000 at /health/ready, whatever the relative path.
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry the localhost:8180 issuer, while containers reach Keycloak as keycloak:8180.
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      # Behind a TLS proxy on a server, Keycloak trusts its X-Forwarded headers (deploy/server/README.md). Harmless locally: nothing sends them.
      KC_PROXY_HEADERS: xforwarded
      # The realm file takes the PCAS address for its sign-in redirects (D-231).
      PCAS_URL: ${PCAS_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The health endpoints are on the management port, 9000. Keycloak's image has no curl, so use bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  pcas-api:
    restart: unless-stopped
    image: ghcr.io/beedev/ue-pcas-pcas-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Clock__Mode: ${CLOCK__MODE:-Offset}
      Clock__Anchor: ${CLOCK__ANCHOR:-2026-10-16T18:00:00Z}
      Testing__ResetSecret: ${RESET_SECRET:-}
      Keycloak__ClientSecret: ${SVC_PCAS_API_CLIENT_SECRET:-svc-pcas-api-local-secret}
      ConnectionStrings__Pcas: Host=postgres;Database=${POSTGRES_DB:-pcas};Username=${POSTGRES_USER:-pcas};Password=${POSTGRES_PASSWORD:-pcas}
      Auth__MetadataAddress: http://keycloak:8180${KEYCLOAK_PATH:-}/realms/ue/.well-known/openid-configuration
      Auth__ValidIssuer: ${KEYCLOAK_URL:-http://localhost:8180}/realms/ue
      Auth__Audience: pcas-api
      Services__Mocks: http://mock-systems:8080
      # Which model answers (D-005, D-220): Replay (the default; recorded replies, nothing leaves the system), Anthropic, AzureOpenAI or OpenAI. OpenAI (api.openai.com) is for the demo. The production
      # provider is not chosen yet; it will be agreed with UE (D-230). The key and model are read from OPENAI_API_KEY and OPENAI_MODEL in the git-ignored .env; they are never logged or shown.
      AI__PROVIDER: ${AI__PROVIDER:-Replay}
      AI__OPENAI__APIKEY: ${OPENAI_API_KEY:-}
      AI__OPENAI__MODEL: ${OPENAI_MODEL:-}
      AI__OPENAI__INPUTPERMTOK: ${OPENAI_INPUT_PER_MTOK:-2}
      AI__OPENAI__OUTPUTPERMTOK: ${OPENAI_OUTPUT_PER_MTOK:-8}
      # The statements the AI governance page shows as the controls in force (SPEC section 12.4). The defaults hold for any provider (D-230, D-233); a deployment that names its provider sets AI__CONTROLS__PROVIDER.
      AI__CONTROLS__PROVIDER: "${AI__CONTROLS__PROVIDER:-Configured per deployment}"
      AI__CONTROLS__DATAHANDLING: "${AI__CONTROLS__DATAHANDLING:-Claim text is sent only to the AI provider configured for this deployment.}"
      AI__CONTROLS__RETENTION: "${AI__CONTROLS__RETENTION:-Every AI call is kept as an event with its prompt version, model, cost and the reviewer's decision. Nothing is deleted.}"
      AI__CONTROLS__HUMANREVIEW: "${AI__CONTROLS__HUMANREVIEW:-Required before any AI value is saved: the adjuster accepts, edits or rejects each field and agrees or disagrees with each indicator.}"
    networks:
      default:
        aliases:
          - pcas-api-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mock-systems:
    restart: unless-stopped
    image: ghcr.io/beedev/ue-pcas-mock-systems:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Mocks: Host=postgres;Database=mocks;Username=${POSTGRES_USER:-pcas};Password=${POSTGRES_PASSWORD:-pcas}
      Services__Pcas: http://pcas-api:8080
      # The trailing slash is needed: the token path is relative, and without it a KEYCLOAK_PATH would be dropped.
      Services__Keycloak: http://keycloak:8180${KEYCLOAK_PATH:-}/
      # The Workbench page takes UE's colours and fonts from the BFF's design, fetched by the server (no CORS), with a fallback.
      Services__Bff: http://pcas-bff:4201
      Workbench__ClientId: uw-workbench
      Workbench__ClientSecret: ${UW_WORKBENCH_CLIENT_SECRET:-uw-workbench-local-secret}
      # Links the stand-ins hand to the browser (the ImageRight viewer) use the site's own address: Kong serves /sim there (I-01, D-233).
      ImageRight__PublicBaseUrl: ${PCAS_URL:-http://localhost:8080}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MOCKS_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    restart: unless-stopped
    image: ghcr.io/beedev/ue-pcas-web:latest
    environment:
      # The path prefix the site is served under when a proxy publishes it there, for example /ue-pcas. Empty serves the root of the address.
      PCAS_BASE_PATH: ${PCAS_BASE_PATH:-}
    depends_on:
      pcas-api:
        condition: service_healthy
    networks:
      default:
        aliases:
          - pcas-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  bff:
    restart: unless-stopped
    # The token-handler BFF (D-151), built from the DXP fork at the commit pinned in deploy/bff/dxp-commit (run scripts/dxp-checkout.sh first). No published port: Kong is the only way in.
    image: ghcr.io/beedev/ue-pcas-bff:latest
    depends_on:
      keycloak:
        condition: service_healthy
      pcas-api:
        condition: service_healthy
    environment:
      BFF_PORT: "4201"
      NODE_ENV: production
      PCAS_ADAPTER: hip
      PCAS_API_URL: http://pcas-api-internal:8080
      OIDC_ADAPTER: openid-client
      # Tokens carry the localhost:8180 issuer, while the container reaches Keycloak as keycloak:8180.
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:8180}/realms/ue
      OIDC_DISCOVERY_URL: http://keycloak:8180${KEYCLOAK_PATH:-}/realms/ue/.well-known/openid-configuration
      OIDC_CLIENT_ID: pcas-bff
      OIDC_CLIENT_SECRET: ${PCAS_BFF_CLIENT_SECRET:-pcas-bff-local-secret}
      OIDC_ALLOW_HTTP: "true"
      # The BFF takes the bare origin (scheme, host, port) and the path prefix apart: PCAS_ORIGIN when PCAS_URL carries a prefix, else PCAS_URL as it is.
      PUBLIC_ORIGINS: ${PCAS_ORIGIN:-${PCAS_URL:-http://localhost:8080}},http://localhost:5173
      PUBLIC_BASE_PATH: ${PCAS_BASE_PATH:-}
      SESSION_STORE: memory
      SESSION_COOKIE_SECURE: "true"
      SESSION_IDLE_SECONDS: "1800"
      SESSION_ABSOLUTE_SECONDS: "36000"
      SESSION_MAX_TRANSACTIONS: "10000"
      SESSION_MAX_SESSIONS: "10000"
      KEYCLOAK_HEALTH_URL: http://keycloak:9000/health/ready
      DEV_AUTH_BYPASS: "false"
      # DESIGN.md, the one source of the look (D-153): the BFF reads it from the mounted branding folder and serves GET /bff/design.
      DESIGN_ADAPTER: file
      DESIGN_FILE: /srv/branding/DESIGN.md
    volumes:
      - ./config/branding:/srv/branding:ro
    networks:
      default:
        aliases:
          - pcas-bff
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4201/bff/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kong:
    restart: unless-stopped
    # Tag and digest: the digest is the multi-architecture index, so the same bytes are pulled on amd64 and arm64.
    image: kong:3.9.1@sha256:76c14b93e989f7f4418039f7f9789ca32564016211c86ac1a18022f4788e7b9c
    depends_on:
      pcas-api:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
      bff:
        condition: service_healthy
        restart: true
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8080"
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # No "Server: kong" and no latency headers. The plugins' own headers (X-RateLimit-*) are unaffected.
      KONG_HEADERS: "off"
      # nginx's own cap, behind the 1 MB size-limiting plugin. The plugin counts chunked bodies too; this makes nginx stop reading at 1 MB instead of buffering the whole body to a temp file first.
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: "1m"
      # Short DNS cache, so a rebuilt pcas-api or web (new container address) is found again within seconds.
      KONG_DNS_VALID_TTL: "5"
      # A name that does not resolve yet (a service still starting) is retried after one second, not cached as missing.
      KONG_DNS_NOT_FOUND_TTL: "1"
    volumes:
      - ./config/kong:/kong/declarative:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "${BIND_ADDRESS:-127.0.0.1}:${PCAS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
